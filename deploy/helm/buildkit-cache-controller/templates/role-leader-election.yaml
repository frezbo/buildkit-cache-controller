{{- if .Values.leaderElection.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "buildkit-cache-controller.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkit-cache-controller.labels" . | nindent 4 }}
rules:
  # Scoped to the single lease named by --leader-elect-id. create has no
  # resourceNames (the resource doesn't exist yet); get/update/patch are
  # the live verbs once it's there. No list/watch/delete needed.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ include "buildkit-cache-controller.leaderElectionID" . }}]
    verbs: [get, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "buildkit-cache-controller.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkit-cache-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "buildkit-cache-controller.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "buildkit-cache-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
