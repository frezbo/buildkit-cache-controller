{{- if .Values.runnerServiceAccount.enabled -}}
{{- $name := .Values.runnerServiceAccount.name -}}
{{- $labels := include "buildkit-cache-controller.labels" . -}}
{{- range $ns := .Values.allowedNamespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
---
# Minimum perms for cb-hook: create the CR on job-started, patch the
# lastActivity annotation on both events. No list/delete needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [ci.siderolabs.com]
    resources: [cachedbuilds]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
{{- end }}
{{- end }}
